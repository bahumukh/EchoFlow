name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Setup Engine (whisper.cpp & Models)
      run: |
        chmod +x ./macOS/scripts/setup-engine.sh
        ./macOS/scripts/setup-engine.sh

    - name: Build Application
      run: |
        chmod +x ./macOS/scripts/build-app.sh
        ./macOS/scripts/build-app.sh

    - name: Package Release ZIP
      run: |
        cd macOS/dist
        zip -ry Echoflow-macOS.zip Echoflow.app

    - name: Upload Artifact (CI)
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v4
      with:
        name: Echoflow-macOS
        path: macOS/dist/Echoflow-macOS.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: macOS/dist/Echoflow-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Engine (whisper.cpp & Models)
      shell: bash
      run: |
        mkdir -p Runtime/models
        git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git Vendor/whisper.cpp
        cd Vendor/whisper.cpp
        cmake -B build
        cmake --build build --config Release
        cp build/bin/Release/whisper-cli.exe ../../Runtime/
        curl -L -o ../../Runtime/models/ggml-small.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin

    - name: Build WPF Application
      shell: bash
      run: |
        cd Windows
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../dist/Windows

    - name: Package Release ZIP
      shell: bash
      run: |
        cp -r Runtime dist/Windows/
        cd dist/Windows
        zip -ry ../Echoflow-Windows.zip .

    - name: Upload Artifact (CI)
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v4
      with:
        name: Echoflow-Windows
        path: dist/Echoflow-Windows.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Echoflow-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgtk-3-dev libasound2-dev libx11-dev libxtst-dev

    - name: Setup Engine (whisper.cpp & Models)
      run: |
        mkdir -p Runtime/models
        git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git Vendor/whisper.cpp
        cd Vendor/whisper.cpp
        cmake -B build
        cmake --build build --config Release
        cp build/bin/whisper-cli ../../Runtime/
        curl -L -o ../../Runtime/models/ggml-small.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin

    - name: Build GTK Application
      run: |
        cd Linux
        mkdir build && cd build
        cmake ..
        make
        mkdir -p ../../dist/Linux
        cp echoflow ../../dist/Linux/

    - name: Package Release ZIP
      run: |
        cp -r Runtime dist/Linux/
        cd dist/Linux
        zip -ry ../Echoflow-Linux.zip .

    - name: Upload Artifact (CI)
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v4
      with:
        name: Echoflow-Linux
        path: dist/Echoflow-Linux.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Echoflow-Linux.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
